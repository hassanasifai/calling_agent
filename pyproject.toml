[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nrsp-voice-agent"
version = "0.1.0"
description = "Windows-native Urdu voice agent orchestration"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.11,<3"]

[project.optional-dependencies]
voice-engine = [
  "pipecat-ai[ollama,piper,silero,whisper]==1.13.0",
]
dev = [
  "black>=25.1,<26",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=nrsp_agent --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.setuptools.packages.find]
include = ["nrsp_agent*"]

