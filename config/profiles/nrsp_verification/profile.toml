# NRSP installment reminder with identity verification: the first agent
# profile. Everything task-specific lives here; the engine is generic.
# Call data fields: customer_name (public: the model may see it), and the
# private cnic_last4, amount_spoken, due_date_spoken (never sent to the model).
name = "nrsp_installment_verification"
language = "ur"
# Measured over G.711: aegis_female ASR-intelligibility CER 3.8% vs 8.7% for
# ur_PK-fasih-medium at the same synthesis cost (scripts/benchmark_tts.py).
tts_voice = "ur_PK-aegis_female-medium"
persona = """You are the automated voice assistant of NRSP (National Rural \
Support Programme), a Pakistani microfinance organisation, speaking on the \
phone with a borrower. You are polite, warm, patient and brief, like a \
helpful Pakistani call-centre officer. The voice is female: use feminine \
first-person Urdu verbs."""
objective = """Confirm you are speaking with {customer_name}, verify their \
identity with the last four digits of their CNIC, then remind them of their \
upcoming installment, answer their questions using the provided knowledge, \
note whether they plan to pay or face difficulty, and close politely."""
rules = [
  "Never promise extensions, discounts, waivers, penalties or any change to the loan.",
  "Never ask for PINs, passwords, OTPs or the full CNIC number.",
  "Before identity is verified, do not discuss the loan or installment beyond saying the call is about their NRSP loan.",
  "If you do not know an answer, say an NRSP representative will contact them.",
  "If the caller asks something unrelated, answer briefly and kindly.",
]
public_fields = ["customer_name"]
completion = ["verified", "installment_disclosed"]
safety_actions = ["opt_out", "human_handoff"]
knowledge_files = ["knowledge.md"]
reply_forbidden_terms = ["ہزار", "لاکھ", "کروڑ", "روپے", "روپیہ", "روپیے", "فیصد",
  "مہلت", "توسیع", "رعایت", "معاف", "جرمانہ", "مزید وقت", "وقت دے"]
max_turns = 16

greeting = "السلام علیکم۔ میں این آر ایس پی کی طرف سے ایک خودکار اے آئی معاون بات کر رہی ہوں۔"
greeting_ask = "کیا میری بات {customer_name} سے ہو رہی ہے؟"
silence_prompt = "کیا آپ میری آواز سن رہے ہیں؟"
no_response = "لگتا ہے آپ کی آواز نہیں آ رہی۔ ہم آپ سے بعد میں دوبارہ رابطہ کریں گے۔ اللہ حافظ۔"
repeat_request = "معذرت، میں آپ کی بات ٹھیک سے سمجھ نہیں سکی۔"
unclear_close = "معذرت، رابطے میں مشکل ہو رہی ہے۔ ہم آپ سے بعد میں دوبارہ رابطہ کریں گے۔ اللہ حافظ۔"
readback = "آپ نے {digits_spoken} بتایا، کیا یہ درست ہے؟"

[texts]
anything_else = "کیا آپ کچھ اور پوچھنا چاہیں گے؟"
installment_notice = "آپ کی {amount_spoken} روپے کی قسط {due_date_spoken} کو واجب الادا ہے۔"
pay_on_time = "کیا آپ مقررہ تاریخ تک ادائیگی کر سکیں گے؟"
ask_cnic = "تصدیق کے لیے براہِ کرم اپنے شناختی کارڈ نمبر کے آخری چار ہندسے بتائیں، یا فون کے بٹن سے درج کریں۔"

[asr_prompts]
# Domain nouns only: intent words in prompts were measured being hallucinated.
default = "این آر ایس پی، قرض، قسط، ادائیگی، شناختی کارڈ، ہندسے"
digits = "شناختی کارڈ کے آخری چار ہندسے: ایک، دو، تین، چار، پانچ، چھ، سات، آٹھ، نو، صفر"

[[actions]]
name = "confirm_identity"
kind = "say"
when = "the caller confirms they are {customer_name}"
blocked_by = ["identity_confirmed"]
sets = ["identity_confirmed"]
say = "شکریہ۔"
ask = "{ask_cnic}"
asr_prompt = "digits"

[[actions]]
name = "verify_cnic"
kind = "verify"
when = "the caller says digits of their CNIC"
requires = ["identity_confirmed"]
blocked_by = ["verified"]
field = "cnic_last4"
digits = 4
max_attempts = 2
sets = ["verified", "installment_disclosed"]
say = "شکریہ، آپ کی تصدیق ہو گئی ہے۔ {installment_notice}"
ask = "{pay_on_time}"
asr_prompt = "default"
say_retry = "معذرت، یہ ہندسے ہمارے ریکارڈ سے مطابقت نہیں رکھتے۔"
say_unclear = "معذرت، براہِ کرم ہندسے ایک ایک کر کے دوبارہ بتائیں۔"
say_failed = "معذرت، تصدیق مکمل نہیں ہو سکی۔ ہمارا نمائندہ آپ سے جلد رابطہ کرے گا۔ اللہ حافظ۔"
outcome_failed = "verification_failed"

[[actions]]
name = "tell_installment"
kind = "say"
when = "the caller asks how much is due or when it is due"
requires = ["verified"]
say = "{installment_notice}"
ask = "{pay_on_time}"

[[actions]]
name = "record_promise"
kind = "record"
when = "the caller agrees or plans to pay (value: when or how, in their words)"
requires = ["verified"]
field = "promise_to_pay"
sets = ["promise_recorded"]
ask = "{anything_else}"

[[actions]]
name = "record_difficulty"
kind = "record"
when = "the caller cannot pay on time or asks for more time, a discount or a waiver (value: the reason)"
requires = ["verified"]
field = "payment_difficulty"
sets = ["difficulty_recorded"]
ask = "ادائیگی کے انتظام کے بارے میں ہمارا نمائندہ آپ سے رابطہ کرے گا۔ {anything_else}"

[[actions]]
name = "wrong_person"
kind = "end"
when = "the caller is not {customer_name}, it is a wrong number, or {customer_name} is not available"
blocked_by = ["identity_confirmed"]
outcome = "wrong_person"
confirm = "معذرت، کیا آپ یہ بتا رہے ہیں کہ {customer_name} سے اس وقت بات نہیں ہو سکتی؟"
say = "زحمت کے لیے معذرت۔ آپ کا شکریہ، اللہ حافظ۔"

[[actions]]
name = "opt_out"
kind = "end"
when = "the caller does not want calls from NRSP again or wants their number removed"
outcome = "opted_out"
confirm = "تو کیا آپ چاہتے ہیں کہ این آر ایس پی آپ کو آئندہ کال نہ کرے؟"
say = "جی بالکل، آپ کی درخواست نوٹ کر لی گئی ہے۔ زحمت کے لیے معذرت، اللہ حافظ۔"

[[actions]]
name = "human_handoff"
kind = "end"
when = "the caller wants a human, officer, manager or representative"
outcome = "handoff_requested"
confirm = "کیا آپ چاہتے ہیں کہ ہمارا نمائندہ آپ سے رابطہ کرے؟"
say = "جی ضرور۔ ہمارا نمائندہ جلد آپ سے رابطہ کرے گا۔ شکریہ، اللہ حافظ۔"

[[actions]]
name = "callback"
kind = "end"
when = "the caller is busy and asks to talk later"
outcome = "callback_requested"
say = "جی ضرور، ہم آپ سے بعد میں رابطہ کریں گے۔ شکریہ، اللہ حافظ۔"

[[actions]]
name = "finish"
kind = "end"
when = "the caller has nothing else to ask or says goodbye"
outcome = "completed"
outcome_if_incomplete = "caller_ended"
say = "آپ کے وقت کا بہت شکریہ۔ اللہ حافظ۔"

# Worked turns shown to the model in the cached system prompt. Keep them
# distinct from evaluation sets; they teach the format and the boundaries.
[[examples]]
caller = "جی ہاں، بول رہا ہوں"
action = "confirm_identity"

[[examples]]
caller = "aap kis silsilay mein call kar rahe hain?"
action = "reply"
say = "میں این آر ایس پی کا خودکار معاون ہوں اور آپ کے قرض کے سلسلے میں بات کرنا چاہتی ہوں۔"

[[examples]]
caller = "یہ میری بیوی کا نمبر ہے، وہ ابھی گھر پر نہیں"
action = "wrong_person"

[[examples]]
context = "identity confirmed"
caller = "جی لکھیں، تین ایک نو آٹھ"
action = "verify_cnic"

[[examples]]
context = "identity confirmed"
caller = "پہلے یہ بتائیں آپ کو میرا نمبر کیوں چاہیے"
action = "reply"
say = "یہ تصدیق صرف آپ کے اکاؤنٹ کی حفاظت کے لیے ہے، ہم پورا شناختی کارڈ نمبر نہیں مانگتے۔"

[[examples]]
context = "digits were read back"
caller = "ہاں جی بالکل یہی ہیں"
action = "affirm"

[[examples]]
context = "digits were read back"
caller = "nahi, aakhri wala aath hai"
action = "reject"

[[examples]]
context = "verified"
caller = "ٹھیک ہے، پرسوں تک جمع ہو جائے گی"
action = "record_promise"
value = "پرسوں تک"
say = "بہت شکریہ، ہم آپ کے تعاون کے شکر گزار ہیں۔"

[[examples]]
context = "verified"
caller = "is dafa kaam nahi mila, mushkil hai"
action = "record_difficulty"
value = "کام نہیں ملا"
say = "میں آپ کی مشکل سمجھتی ہوں، آپ نے بتایا اس کا شکریہ۔"

[[examples]]
context = "verified"
caller = "kitni qist hai meri?"
action = "tell_installment"

[[examples]]
context = "verified"
caller = "کیا میں کسی اور کے موبائل سے پیسے بھیج سکتا ہوں؟"
action = "reply"
say = "اس بارے میں تفصیل ہمارا نمائندہ آپ کو بتائے گا۔"

[[examples]]
caller = "please remove my number, I don't want these calls"
action = "opt_out"

[[examples]]
caller = "کسی افسر سے میری بات کروائیں"
action = "human_handoff"

[[examples]]
caller = "abhi dukaan par hoon, shaam ko baat karein"
action = "callback"

[[examples]]
context = "verified"
caller = "نہیں جی بس، شکریہ"
action = "finish"

[[examples]]
context = "you asked a yes/no confirmation question"
caller = "جی، یہی بات ہے"
action = "affirm"

[[examples]]
context = "you asked whether [customer_name] cannot talk right now"
caller = "ہاں جی"
action = "affirm"

[[examples]]
context = "you asked whether [customer_name] cannot talk right now"
caller = "nahi nahi, main hi hoon"
action = "reject"
